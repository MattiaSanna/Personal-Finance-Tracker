<!doctype html>
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>How poor are you?</title>
  <style>
    /* ===== MATERIAL DESIGN TOKENS (light + dark) ===== */
    :root {
      --md-primary: #6750a4;
      --md-on-primary: #ffffff;
      --md-surface: #ffffff;
      --md-surface-variant: #f3edf7;
      --md-secondary-container: #e8def8;
      --md-on-secondary-container: #1d192b;
      --md-outline: #d0c4de;
      --md-text: #1c1b1f;
      --md-shadow: 0 4px 10px rgba(0,0,0,0.08);
      --radius-lg: 20px;
      --radius-md: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --md-primary: #d0bcff;
        --md-on-primary: #381e72;
        --md-surface: #1c1b1f;
        --md-surface-variant: #2b2930;
        --md-secondary-container: #4a4458;
        --md-on-secondary-container: #e8def8;
        --md-outline: #49454f;
        --md-text: #e6e1e5;
      }
    }

    /* ===== GLOBAL STYLES ===== */
    body { 
      margin: 0; 
      min-height: 100vh; 
      padding: 0.6rem; 
      font-family: system-ui, sans-serif;
      font-size: 1.15rem;
      background: var(--md-surface-variant);
      display: flex; 
      justify-content: center; 
      color: var(--md-text);
    }
    main { 
      width: 100%; 
      max-width: 100%;
      padding: 0.6rem; 
    }
    h1 { 
      text-align: center; 
      font-size: 2rem;                  /* ← bigger heading */
      margin-bottom: 1.5rem;
    }
    
    /* ===== ACTION BAR ===== */
    .actions { 
      display: flex; 
      gap: 10px; 
      justify-content: center; 
      margin-bottom: 1rem; 
      position: relative; 
    }
    
    /* ===== BUTTONS ===== */
    .btn {
      position: relative; 
      border: none; 
      border-radius: 999px; 
      padding: 0.75rem 1.6rem;
      font-size: 1.05rem;               /* ← bigger button text */
      font-weight: 500; 
      cursor: pointer; 
      overflow: hidden;
      transition: transform 120ms; 
      display: inline-flex; 
      align-items: center; 
      gap: 8px;
    }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--md-primary); color: var(--md-on-primary); }
    .btn-secondary { background: var(--md-secondary-container); color: var(--md-on-secondary-container); }

    /* ===== DROPDOWN MENU ===== */
    .menu {
      position: absolute; 
      top: 100%; 
      right: 10%; 
      background: var(--md-surface);
      border: 1px solid var(--md-outline); 
      border-radius: var(--radius-md);
      display: none; 
      flex-direction: column; 
      padding: 8px 0; 
      z-index: 100;
      box-shadow: var(--md-shadow); 
      min-width: 150px;
    }
    .menu.show { display: flex; }
    .menu-item { 
      padding: 10px 20px; 
      cursor: pointer; 
      font-size: 1.05rem;               /* ← bigger menu text */
      color: var(--md-text);
    }
    .menu-item:hover { background: var(--md-surface-variant); }

    /* ===== LOADING SPINNER ===== */
    .spinner { 
      width: 1rem; 
      height: 1rem; 
      border: 2px solid transparent; 
      border-top-color: currentColor;
      border-radius: 50%; 
      display: none; 
      animation: spin 1s linear infinite; 
    }
    .loading .spinner { display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== OUTPUT BLOCK ===== */
    .output { 
      background: var(--md-surface);
      border-radius: var(--radius-lg); 
      padding: 1.8rem; 
      font-family: monospace;
      font-size: 1.3rem;
      border: none;
      white-space: pre-wrap; 
      opacity: 0; 
      transform: translateY(10px); 
      transition: 0.3s;
      color: var(--md-text);
      box-shadow: var(--md-shadow);
    }
    .has-output { opacity: 1; transform: translateY(0); }
    
    /* ===== RIPPLE EFFECT ===== */
    .ripple { 
      position: absolute; 
      border-radius: 50%; 
      background: rgba(255,255,255,0.3); 
      transform: scale(0); 
      animation: ripple 0.6s linear; 
      pointer-events: none; 
    }
    @keyframes ripple { to { transform: scale(4); opacity: 0; } }
  </style>
</head>
<body>
  <main>
    <h1>How poor are you today?</h1>

    <div class="actions">
      <form id="runForm" method="post" action="/run">
        <input type="hidden" name="user_option" id="hiddenInput" value="Default">
        <button type="submit" class="btn btn-primary" id="runBtn">
          Run <span class="spinner"></span>
        </button>
      </form>

      <div style="position: relative;">
        <button type="button" class="btn btn-secondary" id="optBtn">Choose</button>
        <div class="menu" id="menu">
          <div class="menu-item" data-val="Normal">Normal</div>
          <div class="menu-item" data-val="Show more">Show more</div>
          <div class="menu-item" data-val="Stats">Stats</div>
        </div>
      </div>
    </div>

    <pre id="output" class="output {{ 'has-output' if output }}">{{ output }}</pre>
  </main>

  <script>
    (function() {
      const optBtn = document.getElementById('optBtn');
      const menu = document.getElementById('menu');
      const hiddenInput = document.getElementById('hiddenInput');
      const runForm = document.getElementById('runForm');
      const runBtn = document.getElementById('runBtn');

      optBtn.onclick = (e) => { 
        e.stopPropagation(); 
        menu.classList.toggle('show'); 
      };
      
      window.onclick = () => menu.classList.remove('show');

      document.querySelectorAll('.menu-item').forEach(item => {
        item.onclick = function() {
          const val = this.getAttribute('data-val');
          hiddenInput.value = val;
          optBtn.innerText = val;
          menu.classList.remove('show');
        };
      });

      runForm.onsubmit = () => {
        runBtn.classList.add('loading');
        runBtn.disabled = true;
      };

      document.addEventListener('click', function(e) {
        if (!e.target.classList.contains('btn')) return;
        const ripple = document.createElement('span');
        ripple.className = 'ripple';
        e.target.appendChild(ripple);
        setTimeout(() => ripple.remove(), 600);
      });
    })();
  </script>
</body>
</html>
